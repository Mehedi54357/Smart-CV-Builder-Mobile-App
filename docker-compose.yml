version: '3.8'
services:
  api:
    build: ./backend
    ports:
      - "5000:5000"
    env_file: ./backend/.env
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - ./backend/logs:/app/logs

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: smartcv

volumes:
  mongo_data:
